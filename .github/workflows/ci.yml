name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + API tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary for the API tests; keep it between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm test

  e2e:
    name: Docker image + Postman collection
    runs-on: ubuntu-latest
    needs: test
    services:
      mongo:
        # Pinned to 8.2: 8.0.x/8.3.x refuse to start on Linux kernel 6.19+ (SERVER-121912),
        # which GitHub's runners use. 8.2 also matches mongodb-memory-server in the Jest job.
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fuel-the-ride:ci .

      - name: Start app container
        run: |
          docker run -d --name app --network host \
            -e NODE_ENV=development \
            -e PORT=4000 \
            -e MONGODB_URI=mongodb://localhost:27017/fuel_ride \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e BCRYPT_COST=10 \
            fuel-the-ride:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 1
          done
          echo "App did not become healthy"; docker logs app; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run Postman collection (Newman)
        run: npx --yes newman@6 run apps/api/postman/FuelTheRide.postman_collection.json --env-var baseUrl=http://localhost:4000

      - name: App logs
        if: failure()
        run: docker logs app
