# Local development: the app container + MongoDB.
#   cp .env.example .env    (then fill in the JWT secrets)
#   docker compose up --build
# Production uses Render + MongoDB Atlas instead (see docs/ARCHITECTURE.md §9).

services:
  app:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/fuel_ride
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    # Pinned to 8.2: 8.0.x/8.3.x refuse to start on Linux kernel 6.19+ (SERVER-121912).
    # Same version line as mongodb-memory-server in the tests.
    image: mongo:8.2
    ports:
      - "27017:27017" # also lets `npm run dev:api` on your machine use this database
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
