name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, API and web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary for the API tests; keep it between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm test

  e2e:
    name: Docker image + Postman collection
    runs-on: ubuntu-latest
    needs: test
    services:
      mongo:
        # Pinned to 8.2: 8.0.x/8.3.x refuse to start on Linux kernel 6.19+ (SERVER-121912),
        # which GitHub's runners use. 8.2 also matches mongodb-memory-server in the Jest job.
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fuel-the-ride:ci .

      - name: Start app container
        run: |
          docker run -d --name app --network host \
            -e NODE_ENV=development \
            -e PORT=4000 \
            -e MONGODB_URI=mongodb://localhost:27017/fuel_ride \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e BCRYPT_COST=10 \
            fuel-the-ride:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 1
          done
          echo "App did not become healthy"; docker logs app; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Web app is served (incl. client-side routes)
        run: |
          curl -sf http://localhost:4000/ | grep -q '<div id="root">'
          curl -sf http://localhost:4000/foods | grep -q '<div id="root">'
          asset=$(curl -sf http://localhost:4000/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -sf "http://localhost:4000$asset" > /dev/null
          echo "Web app OK ($asset)"

      - name: Run Postman collection (Newman)
        run: npx --yes newman@6 run apps/api/postman/FuelTheRide.postman_collection.json --env-var baseUrl=http://localhost:4000

      - name: App logs
        if: failure()
        run: docker logs app

  backup-drill:
    name: Backup drill (throwaway data and key)
    runs-on: ubuntu-latest
    # Exercises scripts/backup-db.sh end to end on every PR, so the nightly backup can't silently rot
    services:
      source:
        image: mongo:8.2
        ports:
          - 27017:27017
      restore-test:
        image: mongo:8.2
        ports:
          - 27018:27017
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age > /dev/null
      - name: Seed a throwaway database
        run: |
          docker run --rm --network host mongo:8.2 mongosh --quiet mongodb://localhost:27017/fuel_ride --eval '
            db.users.insertMany([{ email: "a@example.com" }, { email: "b@example.com" }]);
            db.foodLibrary.insertOne({ name: "Gel", carbsG: 22 });'
      - name: Throwaway key
        run: |
          age-keygen -o "$RUNNER_TEMP/drill-key.txt" 2> /dev/null
          echo "AGE_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/drill-key.txt")" >> "$GITHUB_ENV"
      - name: Back up, prove it restores, encrypt
        env:
          BACKUP_URI: mongodb://localhost:27017
          RESTORE_TEST_URI: mongodb://localhost:27018
          OUT_DIR: ${{ runner.temp }}/drill
        run: |
          file=$(scripts/backup-db.sh | tee /dev/stderr | tail -1)
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
          test "$(ls "$OUT_DIR")" = "$(basename "$file")" || { echo "Plaintext left behind!"; ls -l "$OUT_DIR"; exit 1; }
      - name: The encrypted file is unreadable without the key, readable with it
        run: |
          ! zcat "$BACKUP_FILE" > /dev/null 2>&1 || { echo "Backup is not encrypted!"; exit 1; }
          age --decrypt --identity "$RUNNER_TEMP/drill-key.txt" "$BACKUP_FILE" \
            | docker run --rm --network host -i mongo:8.2 mongorestore --uri=mongodb://localhost:27018 --archive --gzip --dryRun --quiet
          echo "Decrypts and restores (dry run) with the right key."

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, e2e]
    # Only pushes to main (i.e. merged PRs) deploy, and only after every check passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set yet. Skipping deploy (see docs/DEPLOY.md)."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Deploy triggered for ${GITHUB_SHA::7}"

      - name: Wait for the new version to be healthy
        env:
          APP_URL: ${{ vars.APP_URL }}
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DEPLOY_HOOK" ]; then
            echo "APP_URL variable or deploy hook not set. Skipping the live check."
            exit 0
          fi
          # Render builds the image (~3-5 min), then swaps it in. Poll /api/health until it reports
          # THIS commit with the database up (the old version keeps answering until then). Max ~15 min.
          want="${GITHUB_SHA::7}"
          sleep 60
          for i in $(seq 1 28); do
            health=$(curl -sf --max-time 60 "$APP_URL/api/health" || true)
            if echo "$health" | grep -q "\"version\":\"$want\"" && echo "$health" | grep -q '"db":"up"'; then
              echo "Version $want is live and connected to the database: $APP_URL"
              exit 0
            fi
            # Fallback if the platform doesn't expose the commit: after ~5 min, accept "db up"
            if [ "$i" -ge 10 ] && echo "$health" | grep -q '"version":"dev"' && echo "$health" | grep -q '"db":"up"'; then
              echo "::warning::The app doesn't report its commit (RENDER_GIT_COMMIT missing); it is up with the database connected."
              exit 0
            fi
            echo "Waiting for $want… ($health)"
            sleep 30
          done
          echo "::error::$APP_URL did not serve version $want with the database up within 15 minutes. Check the Render logs."
          exit 1
